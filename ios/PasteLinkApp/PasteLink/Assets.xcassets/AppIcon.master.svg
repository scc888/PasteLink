<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 全画幅底色渐变 (午夜蓝 -> 深邃靛紫 -> 电光群青) -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="45%" stop-color="#141B2D" />
      <stop offset="75%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- 顶部环境光弧光 -->
    <radialGradient id="topLight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 底部电光青反光 -->
    <radialGradient id="bottomGlow" cx="80%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 磨砂玻璃板边框高光 -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>

    <!-- 玻璃板内衬渐变 -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65" />
    </linearGradient>

    <!-- 跨端互联光束能量渐变 (Cyan -> Electric Blue -> Violet -> Neon Pink) -->
    <linearGradient id="energyBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- 金属夹子渐变 -->
    <linearGradient id="clipMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- 发光柔和滤波 -->
    <filter id="beamGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="36" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 卡片下投影 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. 全画幅满铺底色 (100% 充满 1024x1024，无圆角、无留白、无黑边) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#canvasBg)" />

  <!-- 2. 环境光层 -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#topLight)" />
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bottomGlow)" />

  <!-- 3. 主体居中容器 (Safe Area: 居中 650x700 区域) -->
  <g filter="url(#cardShadow)">
    <!-- 剪贴板背板 (磨砂玻璃与高光描边) -->
    <rect x="232" y="210" width="560" height="660" rx="68" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="12" />

    <!-- 剪贴板内部水平导轨横线 (极简质感) -->
    <rect x="312" y="360" width="400" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.16" />
    <rect x="312" y="420" width="280" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.1" />

    <!-- 跨端互联核心：双向无限连接光束 (Infinity Loop Link) -->
    <g filter="url(#beamGlow)">
      <!-- 极速能量轨迹路径 -->
      <path d="M 370 650 C 370 560, 470 560, 512 650 C 554 740, 654 740, 654 650 C 654 560, 554 560, 512 650 C 470 740, 370 740, 370 650 Z"
            fill="none"
            stroke="url(#energyBeam)"
            stroke-width="44"
            stroke-linecap="round"
            stroke-linejoin="round" />

      <!-- 中心聚焦高亮内核 -->
      <circle cx="512" cy="650" r="16" fill="#FFFFFF" />
      <circle cx="410" cy="620" r="8" fill="#FFFFFF" fill-opacity="0.8" />
      <circle cx="614" cy="680" r="8" fill="#FFFFFF" fill-opacity="0.8" />
    </g>

    <!-- 剪贴板顶部金属夹具 -->
    <rect x="372" y="140" width="280" height="120" rx="36" fill="url(#clipMetal)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4" />
    <!-- 夹子顶部定位圆孔 -->
    <circle cx="512" cy="190" r="28" fill="#090D16" stroke="#94A3B8" stroke-width="6" />
    <circle cx="512" cy="190" r="12" fill="#38BDF8" fill-opacity="0.8" />
  </g>
</svg>
