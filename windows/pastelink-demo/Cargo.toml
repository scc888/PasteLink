[package]
name = "pastelink-demo"
version = "0.1.0"
edition = "2021"
description = "PasteLink MVP Demo - Windows BLE GATT Server + Clipboard Monitor"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
arboard = "3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dependencies.windows]
version = "0.58"
features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
]
